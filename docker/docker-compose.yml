services:
  database:
    image: postgres:14
    networks:
      - appnet
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: on-failure
    env_file: ./secrets/.env
    expose:
      - "5432"
  backend:
    build:
      context: ..
      dockerfile: docker/src/backend/Dockerfile
    container_name: backend
    ports:
      - "8081:8081"
    depends_on:
      - database
    networks:
      - appnet

  frontend:
    build:
      context: ..
      dockerfile: docker/src/frontend/Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    networks:
      - appnet
    depends_on:
      - backend

