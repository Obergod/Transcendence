  elasticsearch:
    container_name: elasticsearch
    # depends_on:
    # - elastic-init
    image: docker.elastic.co/elasticsearch/elasticsearch:7.15.0
    # build:
    #   context: ..
    #   dockerfile: docker/src/elasticsearch/Dockerfile
    restart: on-failure
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl --user elastic:${ELASTIC_PASSWORD} --silent --fail https://localhost:9200/_cluster/health -k || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - appnet
    environment:
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/elasticsearch.key
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/ca.pem
      - xpack.ilm.enabled=true
      - path.repo=/usr/share/elasticsearch/snapshots
    ports:
      - 9200:9200
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - ./src/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./certs/elasticsearch/elasticsearch.crt:/usr/share/elasticsearch/config/certs/elasticsearch.crt:ro
      - ./certs/elasticsearch/elasticsearch.key:/usr/share/elasticsearch/config/certs/elasticsearch.key:ro
      - ./certs/ca.pem:/usr/share/elasticsearch/config/certs/ca.pem:ro
      - snapdata:/usr/share/elasticsearch/snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


