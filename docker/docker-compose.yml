  prometheus:
    container_name: prometheus
    image: prom/prometheus
    restart: on-failure
    networks:
      - appnet
    # env_file: ./secrets/.env
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter
    ports:
      - "9100:9100"
    networks:
      - appnet

