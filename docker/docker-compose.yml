  logstash:
    container_name: logstash
    build:
      context: ..
      dockerfile: docker/src/logstash/Dockerfile
    image: custom-logstash:latest
    restart: unless-stopped
    networks:
      - appnet
    environment:
        - LS_JAVA_OPTS=-Xms1g -Xmx1g -Dio.netty.allocator.maxOrder=12
        - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
        - LOGSTASH_LOG_LEVEL=error
        - xpack.monitoring.enabled=false
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./certs/ca.pem:/usr/share/logstash/config/certs/ca.pem:ro
      - ./src/logstash/logs:/usr/share/logstash/logs
      - ./src/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./src/logstash/config/pipeline:/usr/share/logstash/pipeline:ro
      - esdata:/usr/share/logstash/data
    depends_on:
      - elasticsearch
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.15.0
    container_name: docker_filebeat_1
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./sample-logs:/sample-logs:ro
      - ./src/logstash/logs:/var/logs
      - /var/log:/var/log:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - esdata:/var/lib/elasticsearch/data
      - ./certs/ca.pem:/usr/share/elasticsearch/config/certs/ca.pem:ro
      - ./src/logstash/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/app/logs
    depends_on:
      - logstash
    networks:
      - appnet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    container_name: grafana
    image: grafana/grafana
    build:
      context: ..
      dockerfile: docker/src/grafana/Dockerfile
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./src/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      # - ./src/grafana/dashboards:/var/lib/grafana/dashboards
      - ./src/grafana/alerting/alerts.yml:/etc/grafana/provisioning/alerting/alerts.yml:ro
      - ./src/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./src/grafana/ssl:/etc/grafana/ssl:ro
      - ./src/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    restart: on-failure
    user: "472"
    networks:
      - appnet
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3000
      ENV GF_SERVER_PROTOCOL: https
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: secret
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PROMETHEUS_PROXY_ENABLED: "true"
      GF_PROMETHEUS_URL: http://prometheus:9090
      # GF_SERVER_CERT_FILE: /etc/grafana/ssl/grafana.crt
      # GF_SERVER_CERT_KEY: /etc/grafana/ssl/grafana.key
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backup:
    container_name: backup
    build:
      context: ..
      dockerfile: docker/src/backup/Dockerfile
    volumes:
      - postgres_data:/mnt/postgres:ro
      - prometheus_data:/mnt/prometheus:ro
      - esdata:/mnt/esdata:ro
      - backup:/mnt/backup
    networks:
      - appnet

volumes:
  postgres_data:
  grafana-storage:
  prometheus_data:
  esdata:
  kibana:
  certs:
  backup:
  ssl:
  snapdata:

networks:
  appnet:
    driver: bridge
  # elk:
  #   driver: bridge