services:
  database:
    image: postgres:14
    networks:
      - appnet
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: on-failure
    environment:
      POSTGRES_PASSWORD: goodPassword123
      POSTGRES_USER: admin
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"

  backend:
    build:
      context: ..
      dockerfile: docker/src/backend/Dockerfile
    container_name: backend
    ports:
      - "8081:8081"
    depends_on:
      - database
    networks:
      - appnet
    environment:
      DATABASE_URL: postgres://admin:goodPassword123@database:5432/myapp

  frontend:
    build:
      context: ..
      dockerfile: docker/src/frontend/Dockerfile
      additional_contexts:
        backend: service:backend
    container_name: frontend
    ports:
      - "5173:5173"
    networks:
      - appnet
    depends_on:
      - backend


