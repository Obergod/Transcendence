#   - path: docker/docker-compose.setup.yml

services:
  database:
    image: postgres:14
    networks:
      - appnet
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup
    restart: on-failure
    environment:
      POSTGRES_PASSWORD: goodPassword123
      POSTGRES_USER: admin
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"

  backend:
    image: backend-builder:latest
    build:
      context: ..
      dockerfile: docker/src/backend/Dockerfile
    container_name: backend
    ports:
      - "8081:8081"
    depends_on:
      - database
    networks:
      - appnet
    environment:
      DATABASE_URL: postgres://admin:goodPassword123@database:5432/myapp
    healthcheck:
      test: ["CMD", "curl", "-f", "--http1.1", "https://backend:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./backups:/backup
      - ./:/ssl:ro
      - ./logs:/app/logs
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ..
      dockerfile: docker/src/frontend/Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    networks:
      - appnet
    depends_on:
      - backend
    volumes:
      - ./backups:/backup
      - ./ssl:/etc/nginx/ssl:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    restart: on-failure
    networks:
      - appnet
    # env_file: ./secrets/.env
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./src/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./src/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter
    ports:
      - "9100:9100"
    networks:
      - appnet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres-exporter:
    container_name: postgres-exporter
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:goodPassword123@postgres:5432/myapp?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - appnet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


