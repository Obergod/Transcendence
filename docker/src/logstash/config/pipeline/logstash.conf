input {
  beats {
    port => 5044
  }
}

filter {
  grok {
    match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_host} %{DATA:component}(?:%{DATA:component_details})?: %{GREEDYDATA:log_message}" }
  }

  date {
    match => ["syslog_timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSSSSSSSS"]
    target => "@timestamp"
    timezone => "UTC"
  }

  mutate {
    add_field => {
      "environment" => "docker"
      "service" => "ft_transcendence"
      "log_type" => "journal"
    }
  }
  if "Parse line error" in [log_message] {
    drop {}
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "app-logs-%{+YYYY.MM.dd}"
    ssl => true
    ecs_compatibility => "disabled"
    ssl_certificate_verification => "false"
    ecs_compatibility => "disabled"
  }
}