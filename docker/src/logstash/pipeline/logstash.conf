input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_field => {
      "environment" => "docker"
      "service" => "ft_transcendence"
    }
  }
  if [message] {
    mutate {
      rename => { "message" => "log_message" }
    }
  }

  date {
    match => ["@timestamp", "ISO8601"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "app-logs-%{+YYYY.MM.dd}"
    # ssl_enabled => true
    # cacert => "/usr/share/logstash/config/certs/ca.crt"
  }
}