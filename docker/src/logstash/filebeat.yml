filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /app/logs/main.log
    - /app/logs/*.log

output.logstash:
  hosts: ["logstash:5044"]

setup.ilm.enabled: true
setup.template.enabled: true
setup.template.name: "filebeat"
setup.template.pattern: "filebeat-*"

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644