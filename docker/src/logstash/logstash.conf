input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_field => {
      "environment" => "docker"
      "service" => "ft_transcendence"
    }
  }

  date {
    match => ["@timestamp", "ISO8601"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}