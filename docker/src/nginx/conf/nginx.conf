# worker_processes auto;

# events {
#     worker_connections 4096;
#     multi_accept on;
# }

http {
    # include       /etc/nginx/mime.types;
    # default_type  application/octet-stream;

    # sendfile        on;
    # tcp_nopush      on;
    # tcp_nodelay     on;
    # keepalive_timeout 65;
    # types_hash_max_size 1024;
    # server_tokens   off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 64k;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/ssl/localhost.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost-key.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_ecdh_curve secp384r1;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=30s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff";



    # Define upstreams first
    # upstream backend {
    #     server backend:8081 resolve;
    # }

    # upstream frontend {
    #     server frontend:5173 resolve;
    # }

    # upstream prometheus {
    #     server prometheus:9090 resolve;
    # }

    # upstream node-exporter {
    #     server node-exporter:9100 resolve;
    # }

    # upstream postgres-exporter {
    #     server postgres-exporter:9187 resolve;
    # }

    # upstream grafana {
    #     server grafana:3000 resolve;
    # }

    # upstream kibana {
    #     server kibana:5601 resolve;
    # }

    # upstream elasticsearch {
    #     server elasticsearch:9200 resolve;
    # }

    # upstream logstash {
    #     server logstash:9600 resolve;
    # }

# Backend
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name backend;

        # ssl_certificate /etc/nginx/ssl/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl/key.pem;

        location / {
            proxy_pass https://localhost:8081;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Frontend
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name frontend;

        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Prometheus
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name prometheus;

        # ssl_certificate /etc/nginx/ssl/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl/key.pem;

        location / {
            proxy_pass https://prometheus:9090;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Node Exporter
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name node-exporter;

        location / {
            proxy_pass https://node-exporter:9100;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Postgres Exporter
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name postgres-exporter;

        location / {
            proxy_pass http://postgres-exporter:9187;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Grafana
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name grafana;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        location / {
            proxy_pass http://grafana:3000; #if you add certificates, put an s at http
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Grafana-User $http_x_forwarded_user;
        }
    }

    # Kibana
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name kibana;

        location / {
            proxy_pass http://kibana:5601;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Elasticsearch
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name elasticsearch;

        location / {
            proxy_pass http://elasticsearch:9200;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Logstash
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name logstash;

        location / {
            proxy_pass http://logstash:9600;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}